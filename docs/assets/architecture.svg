<svg xmlns="http://www.w3.org/2000/svg" width="1568" height="452" viewBox="0 0 1568 452" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">FESTAI 시스템 아키텍처</title>
  <desc id="desc">방문객 웹과 운영자·상인 콘솔이 Next.js 서버 프록시를 통해 FastAPI에 접속합니다. 단일 백엔드는 identity, festival, engagement, commerce, operations, esg, privacy의 일곱 업무 모듈로 구성됩니다. 도메인과 유스케이스는 포트를 사용하고 PostgreSQL·AI 어댑터는 bootstrap.py에서 연결합니다. 업무 변경·감사·멱등성 기록은 같은 트랜잭션을 공유합니다. 보고서와 개인정보 파기는 별도 워커 프로세스로 실행합니다. 화살표는 주요 실행 흐름이며 소스 코드의 의존성 방향이 아닙니다.</desc>
